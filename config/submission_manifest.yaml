# M5 最终提交物清单
# 量子RL调度系统 — 比赛最终提交物定义与校验规则

submission:
  deadline: "2026-09-15"
  version: "9.1.0"

items:
  # 代码部分
  - id: CODE_REPO
    name: 代码仓库
    type: git_tag
    path: "."
    requirements:
      tag: "v9.1-submission"
      must_pass_ci: true
      must_have_readme: true

  - id: CODE_ARCHIVE
    name: 代码压缩包
    type: zip
    path: "dist/quantum-rl-scheduler-v9.1.zip"
    requirements:
      max_size_mb: 100
      exclude:
        - ".git/"
        - "__pycache__/"
        - "logs/"
        - "results/raw/"
        - "docs/8.7-v3_红队审查报告.md"
        - ".archive/"
        - "archive/"
        # 8.11 审查：内部流程/话术/策略文档不得进入提交包
        - "docs/annealing_significance-defense.md"
        - "docs/award_roadmap.md"
        - "docs/PR审核日志.md"
        - "docs/PR审核日志_934.md"
        - "docs/项目记忆_给AI.md"
        - "docs/defense_narrative_v1.md"
        - "docs/dual_empowerment_asymmetry_analysis.md"
        - "docs/code_freeze.md"
        - "docs/代码冻结操作手册.md"
      include:
        - "src/"
        - "tests/"
        - "scripts/"
        - "docs/"
        - "config/"
        - "README.md"
        - "AGENTS.md"
        - "pyproject.toml"
        - "requirements.txt"
        - "requirements-dev.txt"
        - "requirements.lock"
        - "mypy.ini"
        - "Dockerfile"
        - "docker-compose.yml"
        - ".pre-commit-config.yaml"
        - ".editorconfig"
        - "deliverable_models/"

  # 文档部分
  - id: WHITEPAPER
    name: 技术白皮书
    type: pdf
    path: "docs/technical_whitepaper.pdf"
    requirements:
      min_pages: 20
      max_pages: 50
      must_contain:
        - "摘要"
        - "目录"
        - "参考文献"

  - id: PRESENTATION
    name: 答辩 PPT
    type: pptx
    path: "deliverable_models/答辩PPT.pptx"
    requirements:
      min_slides: 15
      max_slides: 20
      # 5 项必需页按实际页面标题子串匹配（P1 封面 / P2 问题定义 / P3 架构 /
      # P5 实验结果 / P17 团队分工），避免标题在文本框而非 title 占位符时误判
      must_contain_slides:
        - "智能调度系统"   # 封面
        - "核心矛盾"       # 问题定义
        - "架构"           # 架构图
        - "奖励领先"       # 实验结果
        - "团队分工"       # 团队介绍

  # 8.7-v3 红队审查新增：比赛方案第八条第八点硬性要求"务必一并提交参赛报名表"、
  # "提交总结报告"，且"文档要求为 PDF 格式"。此前清单遗漏这两项，导致
  # validate_submission 永远不会报错。现补齐为跟踪项（人工交付物，release CI 跳过）。
  - id: SUMMARY_REPORT
    name: 参赛总结报告
    type: pdf
    path: "docs/参赛总结报告.pdf"
    requirements:
      min_pages: 5
      must_contain:
        - "总结"
        - "创新"

  - id: REGISTRATION_FORM
    name: 参赛报名表
    type: pdf
    path: "docs/参赛报名表.pdf"
    requirements:
      min_pages: 1
      must_contain:
        - "报名"

  - id: DEMO_VIDEO
    name: 演示视频
    type: mp4
    path: "演示视频_量子RL调度系统.mp4"
    requirements:
      max_duration_seconds: 300
      min_duration_seconds: 240
      max_size_mb: 500
      resolution: "1920x1080"

  # 实验报告
  - id: EXP_STRATEGY
    name: 策略对比报告
    type: md
    path: "results/reports/strategy_comparison.md"
    must_exist: true

  - id: EXP_ABLATION
    name: 消融实验报告
    type: md
    path: "results/reports/ablation_report.md"
    must_exist: true

  - id: EXP_STRESS
    name: 压力测试报告
    type: md
    path: "results/reports/stress_test_report.md"
    must_exist: true

  - id: EXP_REAL
    name: 真机验证报告
    type: md
    path: "results/reports/real_machine_validation.md"
    must_exist: true

  - id: EXP_STAT
    name: 统计显著性报告
    type: md
    path: "results/reports/statistical_validation.md"
    must_exist: true

  # 训练好的权威模型检查点（换机复现所必需）
  - id: MODEL_PPO
    name: PPO 权威模型（16维观测）
    type: zip
    path: "deliverable_models/ppo_best_model_16dim.zip"
    requirements:
      max_size_mb: 50
      must_exist: true

  - id: MODEL_PPO_COMPILATION
    name: 编译层 PPO 模型（14维观测，公平对比v2）
    type: zip
    path: "deliverable_models/ppo_compilation_agent.zip"
    requirements:
      max_size_mb: 50
      must_exist: true

  - id: MODEL_PPO_FAIRNESS17
    name: PPO 公平感知模型（17维观测，含公平观测可选维）
    type: zip
    path: "deliverable_models/ppo_fairness17dim.zip"
    requirements:
      max_size_mb: 50
      must_exist: true

  - id: MODEL_MAPPO
    name: MAPPO 多机协同模型（3 机，投票仲裁）
    type: directory
    path: "deliverable_models/mappo/"
    requirements:
      max_size_mb: 100
      must_exist: true
      min_files: 5
      must_contain:
        - "mappo.pt"
        - "mappo_config.json"
        - "independent_ppo"
      exclude_ext:
        - ".tmp"
      note: "含 mappo.pt + mappo_config.json + 3 个独立 PPO 模型（independent_ppo_m0-2.zip）"

  # 其他
  - id: REQUIREMENTS_MATRIX
    name: 需求追溯矩阵
    type: md
    path: "docs/requirements_traceability.md"
    must_exist: true

  - id: AWARD_ALIGNMENT
    name: 评审标准对齐表
    type: md
    path: "docs/award_roadmap.md"
    must_exist: true

  - id: CROSS_HARDWARE_DOC
    name: 跨硬件兼容性文档
    type: md
    path: "docs/cross_hardware.md"
    must_exist: true

  - id: EXP_COMPILATION
    name: 编译层公平对比报告
    type: md
    path: "results/reports/compilation_fair_v2_report.md"
    must_exist: true

  - id: EXP_REAL_AUDIT
    name: 真机审计轨迹
    type: md
    path: "results/reports/real_machine_audit_trail.md"
    must_exist: true
