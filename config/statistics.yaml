# =============================================================================
# 实验3: 退火消融实验 (20seeds, 权威)
# 数据源: results/reports/annealing_ablation_20seeds_report.md
# 注: 旧 5seed 实验已废弃，p=0.190 已被 20seed 的 p=0.9430 替代
# =============================================================================
annealing_ablation_head_only:
  experiment_name: "退火消融实验（20seeds权威验证）"
  applicable_condition: >
    20 Seed 消融实验，对比有/无量子退火加速的PPO策略性能差异。
    使用Wilcoxon秩和检验（非参数）。
    替代旧的 5seed 实验（p=0.190 已废弃）。
  alpha: 0.05
  n: 20
  data_source: "results/reports/annealing_ablation_20seeds_report.md"
  supersedes: "5seed 旧实验（p=0.190，已废弃）"

  with_vs_without_annealing:
    test_method: "Wilcoxon"
    p_value: 0.9430
    effect_size_type: "Cliff's delta"
    effect_size: 0.40
    improvement_pct: -5.6  # 20seed 权威方向：负向（50k checkpoint），正负号含方向
    significant: false
    applicable_condition: "退火消融，20seeds权威验证，n=20"
    note: >
      20seed 权威结论：退火最终 50k checkpoint 提升为 -5.6%（负向，p=0.9430 不显著）。
      效应方向从原始 5seed 的 +6.4% 逆转，证明 +6.4% 源于小样本随机波动。
      Cliff's delta=0.40 仅反映分布重叠，不代表"实际提升趋势"，不得作为正向证据。
      答辩话术: 诚实披露负向/不显著，退火为探索性方向而非核心 claim。
      旧 5seed 实验（+6.4%, p=0.190）已废弃，仅作历史记录，禁止再使用。

# =============================================================================
# 实验4: 真机闭环验证 (N=5)
# 数据源: results/reports/real_machine_statistical_significance.md
# =============================================================================
real_machine_closed_loop:
  experiment_name: "真机闭环验证（混合真机 vs 纯仿真）"
  applicable_condition: >
    N=5 per group，对比纯仿真与混合真机PPO策略性能。
    小样本量，不显著，真机N=5不足以支撑性能结论。
  alpha: 0.05
