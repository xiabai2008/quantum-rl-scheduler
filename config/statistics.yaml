# =============================================================================
# 实验6: 量子噪声敏感性配对检验 (N=25 paired, 权威 v3)
# 数据源: results/reports/quantum_noise_paired_25seeds_20260729_095336.md
#   （N=50 canonical 更大样本复核见 quantum_noise_paired_canonical.md，
#     p=8.882e-16，方向一致，均为负向；权威口径 N=25 为 -12.43%，N=50 canonical 为 -12.32%）
# 历史背景: 修复评审报告 P0"量子→AI噪声反馈统计检验（N≥20 seeds）"。
# 注意: 本实验结论为【负向】——真机噪声分布使 PPO 奖励下降 12.43%（p=2.98e-08），
#       即"噪声敏感性"证据，非"量子赋能AI"正向证据。当前量子赋能AI主方向证据
#       以 noise_feedback_v2（N=50，奖励 +1.5% p=0.584 不显著，方向性）为准。
# =============================================================================
quantum_noise_paired_feedback:
  experiment_name: "噪声敏感性配对检验 v3（负向结果：真机噪声致奖励下降，非赋能证据）"
  applicable_condition: >
    25 seeds × 5 episodes × 2 条件 = 250 次独立运行（每条件 125 episodes）。
    配对设计：同一 seed 下运行两条件（Standard 无噪声 vs DistNoise 真机MBS分布），
    以 seed 为配对单元聚合，消除 seed 间方差。
    PPO模型: ppo_best_model_16dim.zip（16维，Actor-Critic）。
    噪声源: tianyan-287 10seeds MBS 分布（均值 0.8863 ± 0.0874）。
    检验方法: Wilcoxon signed-rank 检验（配对非参数检验，单侧 H1: Standard > DistNoise）。
  alpha: 0.05
  n: 25  # 配对样本数
  data_source: "results/reports/quantum_noise_paired_25seeds_20260729_095336.md"
  supersedes: "10seeds 探索性实验（无统计检验，已废弃）"

  strategy_summary:
    Standard:
      mean_reward: 2408.3025
      std_reward: 353.5771
      n: 25
    DistNoise:
      mean_reward: 2109.0211
      std_reward: 317.1873
      n: 25

  paired_test:
    test_method: "Wilcoxon signed-rank"
    statistic: 325.0
    p_value: 2.98e-08
    effect_size_type: "Cohen's d_z"
    effect_size: 7.7089
    paired_diff_mean: 299.2814
    paired_diff_std: 38.8229
    ci_95: [283.2561, 315.3067]
    n: 25
    significant: true
    post_hoc_power: 1.0
    improvement_pct: -12.43
    improvement_pct_ci_95: [-19.49, -4.69]
    applicable_condition: "Wilcoxon signed-rank 配对检验，N=25 seeds，单侧 H1: Standard > DistNoise"
    non_paired_cohens_d: 0.8910  # Issue #641: 非配对效应量对照（pooled_std≈335.88），仍属大效应
    note: >
      v9.1+ 权威统计检验（2026-07-29），修复评审报告 P0 关键问题。
      p=2.98e-08 << α=0.05，拒绝 H0，真机噪声分布对 PPO 策略奖励有显著影响。
      Cohen's d_z=7.7089 为极大效应量（远超 0.8 大效应阈值）。
      d_z 偏大是配对设计的数学特性（std(diffs)≈38.8，因 seed 间方差抵消），
      非效应虚高；非配对 Cohen's d≈0.89 作为对照，仍属大效应且处于合理范围。
      事后功效=1.0，样本量充足。
      噪声导致奖励下降 12.43%（95% CI: [-19.49%, -4.69%]）。
      核心结论依赖 p<0.05 显著性，而非效应量绝对值。详见答辩手册 Q51。
      旧 10seeds 探索性实验（无统计检验）已废弃。

