# =============================================================================
# 单一权威统计源 (Single Authoritative Statistics Source)
# Issue #141: 消除4套p值混用，建立统一统计口径
#
# 本文件是项目中所有统计声明的唯一权威源。
# 所有文档（README、PPT大纲、白皮书、答辩手册、demo脚本）中的统计数字
# 必须可追溯至本文件，由 scripts/check_stats_consistency.py 验证一致性。
#
# 格式规范：
#   每个统计声明包含: value, test_method, n, effect_size, ci_95, applicable_condition
# =============================================================================

metadata:
  version: "1.0.0"
  created: "2026-07-25"
  issue: "#141"
  description: "量子AI双向赋能调度系统 - 单一权威统计源"
  alpha: 0.05
  note: >
    所有文档中的统计数字必须可追溯至本文件。
    不同实验条件下的p值已明确标注适用场景，禁止跨实验条件混用。
    CI检查脚本: scripts/check_stats_consistency.py

# =============================================================================
# 实验1: 8策略50seed仿真对比 (权威实验，N=250 per strategy)
# 数据源: results/reports/statistical_validation.md
# v9.1+ 更新: 基于 16 维交付模型 ppo_best_model_16dim.zip 重新评估
# =============================================================================
simulation_8strategy_50seed:
  experiment_name: "8策略50seed仿真对比（16维交付模型）"
  applicable_condition: >
    16维观测空间（原生16维环境，OBS_DIM=16，v9+ 交付标准），50 seeds × 5 episodes = 250次独立运行，
    每episode 200步，泊松到达λ=0.5，量子任务占比70%，
    PPO模型: ppo_best_model_16dim.zip（16维，Actor-Critic），
    DQN模型: 无（v9已删除，DQN策略位使用Random替代，仅供策略完整性对比）
  alpha: 0.05
  bonferroni_alpha: 0.0018
  num_comparisons: 28
  data_source: "results/reports/statistical_validation.md"
  update_history:
    - "v9.1 (2026-07-29): 基于 16 维交付模型重新评估，PPO 提升 +88.3%→+123.4%"
    - "v9.0 (2026-07-25): 14 维模型评估，PPO 提升 +88.3%（已废弃）"

  # ============================================================
  # 8.5 审查修正（2026-08-05）：基线诚实化
  # 原 +123.4% 对比基线"FCFS"恒返回 2（Hybrid-Default 混合执行，不路由量子机），
  # 作为基线过弱。以真实 FCFS（EnvBasedFCFSScheduler：量子任务→量子机）重跑
  # 50 seeds × 5 episodes = N=250，PPO 提升 +20.2%（Welch t p=7.56e-12，
  # Mann-Whitney U p=1.86e-12 经 Bonferroni 校正显著，95%CI [+14.3%, +26.7%]，
  # rank-biserial=-0.3642 中效应）。+123.4% 保留为 vs Hybrid-Default 旧基线记录。
  # ============================================================
  baseline_revision:
    note: "8.5 审查基线诚实化：FCFS 基线从'恒返回2(Hybrid-Default)'修正为真实 FCFS(量子路由)"
    real_fcfs_mean_reward: 1648.91
    real_fcfs_std_reward: 502.9
    real_fcfs_n: 250
    ppo_vs_real_fcfs_pct: 20.2
    ppo_vs_real_fcfs_welch_t: 7.02
    ppo_vs_real_fcfs_p_value: 7.56e-12
    ppo_vs_real_fcfs_mannwhitney_p: 1.86e-12
    ppo_vs_real_fcfs_ci_95: [14.3, 26.7]
    legacy_hybrid_default_baseline:
      note: "+123.4% 为 vs Hybrid-Default(恒action=2) 旧基线，基线过弱，仅供历史"
      fcfs_mean_reward: 1051.59
      ppo_improvement_pct: 123.4

  strategy_summary:
    # 8.5 审查统一：PPO 为 N=250 真实 FCFS(1648.91) 基线下的 1982.69（+20.24%），
    # 旧 2348.91/+123.4% 为 vs Hybrid-Default(恒action=2) 弱基线，已废弃（见 legacy_hybrid_default_baseline）。
    PPO:
      mean_reward: 1982.69
      std_reward: 557.25
      stderr: 35.24
      n: 250
      improvement_vs_fcfs_pct: 20.24
      improvement_ci_95: [14.3, 26.7]
      baseline: "真实 FCFS (EnvBasedFCFSScheduler, 1648.91)"
    SJF:
      mean_reward: 774.86
      std_reward: 275.74
      stderr: 17.44
      n: 250
      improvement_vs_fcfs_pct: -53.0
    FCFS:
      mean_reward: 1648.91
      std_reward: 502.95
      stderr: 31.81
      n: 250
      improvement_vs_fcfs_pct: 0.0  # 基线（8.5 修正：真实 FCFS 量子路由；旧 1051.59 为 Hybrid-Default 恒action=2）
    DQN:
      mean_reward: 602.37
      std_reward: 262.09
      stderr: 16.57
      n: 250
      improvement_vs_fcfs_pct: -63.47
      note: "8.5 审查：DQN 模型已删除，行数据与 Random 完全相同（602.37）= Random 策略占位，非独立 DQN 结果"
    Random:
      mean_reward: 602.37
      std_reward: 262.09
      stderr: 16.57
      n: 250
      improvement_vs_fcfs_pct: -63.47
    Greedy:
      mean_reward: 80.71
      std_reward: 549.12
      stderr: 34.72
      n: 250
      improvement_vs_fcfs_pct: -95.1
    Quantum-Only:
      mean_reward: -940.56
      std_reward: 205.83
      stderr: 13.02
      n: 250
      improvement_vs_fcfs_pct: -189.4
    Classical-Only:
      mean_reward: -1128.79
      std_reward: 59.17
      stderr: 3.74
      n: 250
      improvement_vs_fcfs_pct: -207.3

  # 核心对比: PPO vs FCFS (仿真)
  ppo_vs_fcfs:
    test_method: "Welch t"
    statistic: -23.8732
    p_value: 1.449e-66
    effect_size_type: "Cohen's d"
    effect_size: -2.1353
    mean_diff: -1297.32
    ci_95: [-1404.35, -1190.30]
    n: 250
    significant: true
    applicable_condition: "PPO vs FCFS 仿真环境，8策略50seed实验，16维交付模型，N=250"
    note: >
      v9.1+ 权威p值（16维交付模型 ppo_best_model_16dim.zip）。
      数据通过正态性检验，使用 Welch t 检验（方差不齐）。
      Cohen's d=-2.1353 为大效应量。
      禁止与真机实验p值(p<0.001, 10seed v2)或其他实验条件的p值混用。
      旧 14 维模型 p=1.032e-42 (Mann-Whitney U) 已废弃。

  # 其他关键两两对比
  ppo_vs_dqn:
    test_method: "Welch t"
    p_value: 1.315e-77
    effect_size_type: "Cohen's d"
    effect_size: -2.2581
    n: 250
    note: "DQN 位使用 Random 替代，故与 ppo_vs_random 等价"

  ppo_vs_sjf:
    test_method: "Mann-Whitney U"
    p_value: 6.511e-62
    effect_size_type: "rank-biserial"
    effect_size: -0.8583
    n: 250

  ppo_vs_random:
    test_method: "Welch t"
    p_value: 1.315e-77
    effect_size_type: "Cohen's d"
    effect_size: -2.2581
    n: 250
    note: >
      v9.1+ 16维模型: p=1.315e-77, Cohen's d=-2.2581。
      旧 14 维模型 p=4.92e-55 已废弃。

  dqn_vs_fcfs:
    test_method: "Welch t"
    p_value: 5.681e-14
    effect_size_type: "Cohen's d"
    effect_size: -0.7102
    n: 250
    note: "DQN 位使用 Random 替代，故与 random_vs_fcfs 等价"

  fcfs_vs_sjf:
    test_method: "Mann-Whitney U"
    p_value: 0.2827
    effect_size_type: "rank-biserial"
    effect_size: 0.0556
    n: 250
    significant: false

