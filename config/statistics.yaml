# =============================================================================
# 单一权威统计源 (Single Authoritative Statistics Source)
# Issue #141: 消除4套p值混用，建立统一统计口径
#
# 本文件是项目中所有统计声明的唯一权威源。
# 所有文档（README、PPT大纲、白皮书、答辩手册、demo脚本）中的统计数字
# 必须可追溯至本文件，由 scripts/check_stats_consistency.py 验证一致性。
#
# 格式规范：
#   每个统计声明包含: value, test_method, n, effect_size, ci_95, applicable_condition
# =============================================================================

metadata:
  version: "1.0.0"
  created: "2026-07-25"
  issue: "#141"
  description: "量子AI双向赋能调度系统 - 单一权威统计源"
  alpha: 0.05
  note: >
    所有文档中的统计数字必须可追溯至本文件。
    不同实验条件下的p值已明确标注适用场景，禁止跨实验条件混用。
    CI检查脚本: scripts/check_stats_consistency.py

# =============================================================================
# 实验1: 8策略50seed仿真对比 (权威实验，N=250 per strategy)
# 数据源: results/reports/statistical_validation.md
# v9.1+ 更新: 基于 16 维交付模型 ppo_best_model_16dim.zip 重新评估
# =============================================================================
simulation_8strategy_50seed:
  experiment_name: "8策略50seed仿真对比（16维交付模型）"
  # 8.8 口径声明：std_reward 使用总体标准差（ddof=0）。
  # statistical_validation.md 使用样本标准差（ddof=1，558.37/503.96），
  # 两者均为合法口径（N=250 时差异 <0.2%），对外引用以本 yaml（ddof=0）为权威。
  std_ddof: 0
  applicable_condition: >
    16维观测空间（原生16维环境，OBS_DIM=16，v9+ 交付标准），50 seeds × 5 episodes = 250次独立运行，
    每episode 200步，泊松到达λ=0.5，量子任务占比70%，
    PPO模型: ppo_best_model_16dim.zip（16维，Actor-Critic），
    DQN模型: 无（v9已删除，DQN策略位使用Random替代，仅供策略完整性对比）
  alpha: 0.05
  bonferroni_alpha: 0.0018
  num_comparisons: 28
  data_source: "results/reports/statistical_validation.md"
  update_history:
    - "v9.1 (2026-07-29): 基于 16 维交付模型重新评估，PPO 提升 +88.3%→+123.4%"
    - "v9.0 (2026-07-25): 14 维模型评估，PPO 提升 +88.3%（已废弃）"

  # ============================================================
  # 8.5 审查修正（2026-08-05）：基线诚实化
  # 原 +123.4% 对比基线"FCFS"恒返回 2（Hybrid-Default 混合执行，不路由量子机），
  # 作为基线过弱。以真实 FCFS（EnvBasedFCFSScheduler：量子任务→量子机）重跑
  # 50 seeds × 5 episodes = N=250，PPO 提升 +20.2%（Welch t p=7.56e-12，
  # Mann-Whitney U p=1.86e-12 经 Bonferroni 校正显著，95%CI [+14.3%, +26.7%]，
  # rank-biserial=-0.3642 中效应）。+123.4% 保留为 vs Hybrid-Default 旧基线记录。
  # ============================================================
  baseline_revision:
    note: "8.5 审查基线诚实化：FCFS 基线从'恒返回2(Hybrid-Default)'修正为真实 FCFS(量子路由)"
    real_fcfs_mean_reward: 1648.91
    real_fcfs_std_reward: 502.95
    real_fcfs_n: 250
    ppo_vs_real_fcfs_pct: 20.2
    ppo_vs_real_fcfs_welch_t: 7.02
    ppo_vs_real_fcfs_p_value: 7.56e-12
    ppo_vs_real_fcfs_mannwhitney_p: 1.86e-12
    ppo_vs_real_fcfs_ci_95: [14.3, 26.7]
    legacy_hybrid_default_baseline:
      note: "+123.4% 为 vs Hybrid-Default(恒action=2) 旧基线，基线过弱，仅供历史"
      fcfs_mean_reward: 1051.59
      ppo_improvement_pct: 123.4

  strategy_summary:
    # 8.5 审查统一：PPO 为 N=250 真实 FCFS(1648.91) 基线下的 1982.69（+20.24%），
    # 旧 2348.91/+123.4% 为 vs Hybrid-Default(恒action=2) 弱基线，已废弃（见 legacy_hybrid_default_baseline）。
    PPO:
      mean_reward: 1982.69
      std_reward: 557.25
      stderr: 35.24
      n: 250
      improvement_vs_fcfs_pct: 20.24
      improvement_ci_95: [14.3, 26.7]
      baseline: "真实 FCFS (EnvBasedFCFSScheduler, 1648.91)"
    SJF:
      mean_reward: 774.86
      std_reward: 275.74
      stderr: 17.44
      n: 250
      improvement_vs_fcfs_pct: -53.0
    FCFS:
      mean_reward: 1648.91
      std_reward: 502.95
      stderr: 31.81
      n: 250
      improvement_vs_fcfs_pct: 0.0  # 基线（8.5 修正：真实 FCFS 量子路由；旧 1051.59 为 Hybrid-Default 恒action=2）
    DQN:
      mean_reward: 602.37
      std_reward: 262.09
      stderr: 16.57
      n: 250
      improvement_vs_fcfs_pct: -63.47
      note: "8.5 审查：DQN 模型已删除，行数据与 Random 完全相同（602.37）= Random 策略占位，非独立 DQN 结果"
    Random:
      mean_reward: 602.37
      std_reward: 262.09
      stderr: 16.57
      n: 250
      improvement_vs_fcfs_pct: -63.47
    Greedy:
      mean_reward: 80.71
      std_reward: 549.12
      stderr: 34.72
      n: 250
      improvement_vs_fcfs_pct: -95.1
    Quantum-Only:
      mean_reward: -826.59
      std_reward: 263.63
      stderr: 16.67
      n: 250
      improvement_vs_fcfs_pct: -150.1
    Classical-Only:
      mean_reward: -1075.49
      std_reward: 75.04
      stderr: 4.75
      n: 250
      improvement_vs_fcfs_pct: -165.2

  # 核心对比: PPO vs FCFS (仿真，8.5 基线诚实化：真实 FCFS 量子路由)
  # 符号约定：本块统一使用 FCFS-PPO 方向（负值），与 statistical_validation.md 权威口径一致。
  #   mean_diff = FCFS_mean - PPO_mean = -333.78；Welch t（FCFS-PPO）= -7.02，p=7.56e-12。
  #   对应 PPO 相对 FCFS 提升 +20.2%（见 strategy_summary.PPO.improvement_vs_fcfs_pct）。
  ppo_vs_fcfs:
    test_method: "Welch t"
    statistic: -7.02
    p_value: 7.56e-12
    effect_size_type: "rank-biserial"
    effect_size: -0.3642
    mean_diff: -333.78
    ci_95: [-427.24, -240.31]
    n: 250
    significant: true
    applicable_condition: "PPO vs FCFS 仿真环境，8策略50seed实验，16维交付模型，N=250"
    note: >
      8.5 基线诚实化后权威值（真实 FCFS 量子路由基线，16 维交付模型 ppo_best_model_16dim.zip）。
      PPO 1982.69 vs FCFS 1648.91，提升 +20.2%（95%CI [+14.3%, +26.7%]）。
      Welch t（FCFS-PPO 方向）= -7.02，p=7.56e-12；Mann-Whitney U p=1.86e-12（经 Bonferroni 校正显著）。
      效应量 rank-biserial=-0.3642（中效应，见 statistical_validation.md）。
      旧值 t=-4.2334/CI[-439.7,-227.9]/Cohen's d=-2.1353 为 8.5 前弱基线（Hybrid-Default）口径，已废弃并删除。
      禁止与真机实验 p 值(p<0.001, 10seed v2)或其他实验条件的 p 值混用。

  # 其他关键两两对比
  ppo_vs_dqn:
    test_method: "Welch t"
    p_value: 1.315e-77
    effect_size_type: "Cohen's d"
    effect_size: -2.2581
    n: 250
    note: "DQN 位使用 Random 替代，故与 ppo_vs_random 等价"

  ppo_vs_sjf:
    test_method: "Mann-Whitney U"
    # 8.8 修复：从 rewards_multiseed.json 重算（旧 6.511e-62 为过期值，正确为 1.11e-70）
    p_value: 1.11e-70
    effect_size_type: "rank-biserial"
    effect_size: -0.9188
    n: 250

  ppo_vs_random:
    test_method: "Welch t"
    # 8.8 修复：从 rewards_multiseed.json 重算（旧 1.315e-77 为过期值，正确为 3.02e-118）
    p_value: 3.02e-118
    effect_size_type: "Cohen's d"
    effect_size: 3.1636
    n: 250
    note: >
      v9.1+ 16维模型: p=3.02e-118, Cohen's d=3.1636（8.8 重算）。
      旧 14 维模型 p=4.92e-55 已废弃。

  dqn_vs_fcfs:
    test_method: "Welch t"
    # 8.8 修复：从 rewards_multiseed.json 重算（旧 5.681e-14 为过期值，正确为 2.79e-98；
    # DQN 位与 Random 完全同数组，故与 random_vs_fcfs 等价）
    p_value: 2.79e-98
    effect_size_type: "Cohen's d"
    effect_size: -2.6044
    n: 250
    note: "DQN 位使用 Random 替代，故与 random_vs_fcfs 等价"

  fcfs_vs_sjf:
    test_method: "Mann-Whitney U"
    # 8.8 修复：从 rewards_multiseed.json 重算（旧 0.2827 为错误值，差 60 个数量级）
    p_value: 2.28e-60
    effect_size_type: "rank-biserial"
    effect_size: -0.8472
    n: 250
    significant: true

# =============================================================================
# 实验1b: MAPPO 同训练量收敛严格对比（8.7-v4 红队审查 P0-2 口径统一）
# 数据源: results/reports/mappo_strict_comparison_report.md
# 权威口径: 同 wrapper 同种子严格对比（MultiAgentEnvWrapper 同实例、seed=42..51）
# 模型: models/mappo.pt（50K 收敛）；FCFS 每 agent 固定 hybrid（action=2）
# -----------------------------------------------------------------------------
# ⚠️ 口径纪律（8.7-v4 红队审查 P0-2"选择性报告"修复）：
#   对外（演示视频/PPT/novelty/答辩手册）一律使用本块权威值：
#     - MAPPO vs 独立PPO（同训练量、收敛）= +4.0%
#     - MAPPO vs 同环境 FCFS = +396.7%
#   旧 "+84.6%" 来自 multi_machine_comparison_report.md 的 5000 步（未收敛）+
#   训练量不均等（独立PPO 仅 1666 步/机 ≈ MAPPO 的 1/3）早期探索实验，
#   已被同训练量收敛严格对比取代，仅作历史探索记录，禁止作为权威/对外呈现。
# =============================================================================
mappo_strict_strict_comparison:
  experiment_name: "MAPPO 同训练量收敛严格双基线对比（权威）"
  applicable_condition: >
    MultiAgentEnvWrapper 同实例、同种子序列（seed=42..61，20 seeds），
    模型 models/mappo.pt（50K 收敛），FCFS 每 agent 固定 hybrid（action=2），
    任务排序由 env 内部 FCFS 完成。消除评估环境混杂，可直接归因于多智能体协同。
    8.11 升级：N=10 → N=20 并补配对统计检验（此前仅聚合均值无法检验）。
  alpha: 0.05
  n: 20
  data_source: "results/mappo_strict_comparison_result.json"
  supersedes: "multi_machine_comparison_report.md 的 +84.6%（5000 步未收敛，独立PPO 训练量仅 1/3）；N=10 旧口径 +396.7%/+4.0%"

  strategy_summary:
    MAPPO:
      mean_reward: 5507.7
      std_reward: 656.6
      n: 20
    FCFS:
      mean_reward: 917.7
      std_reward: 445.5
      n: 20
    PPO_independent:
      mean_reward: 4033.6
      std_reward: 2066.1
      n: 20

  mappo_vs_fcfs:
    improvement_pct: 500.1
    n: 20
    applicable_condition: "MAPPO(5507.7) vs 同环境 FCFS(917.7)，50K 收敛严格对比"
    paired_test:
      p_wilcoxon: 0.0000
      p_paired_t: 0.0000
      mean_diff: 4590.0
      ci_95: [4277.3, 4902.7]
      significant: true
  mappo_vs_independent_ppo:
    improvement_pct: 36.5
    n: 20
    applicable_condition: "MAPPO(5507.7) vs 3独立PPO(4033.6)，同训练量收敛严格对比"
    paired_test:
      p_wilcoxon: 0.0240
      p_paired_t: 0.0100
      mean_diff: 1474.1
      ci_95: [464.4, 2483.9]
      significant: true
    note: >
      权威口径：+36.5%（同训练量、收敛严格对比，N=20 配对 Wilcoxon p=0.024 显著），
      消除了评估环境混杂，可直接归因于多智能体协同调度（投票仲裁 + 共享 Critic 信用分配）。
      独立 PPO 在部分 seed 性能崩溃（如 seed 56-59 仅 452-2232），MAPPO 保持稳定
      （std 656.6 vs 2066.1），协同优势来自稳定性 + 协作投票。
      完整数据 results/mappo_strict_comparison_result.json（逐 seed 数据见 per_seed 字段）。
  deprecated_846:
    improvement_pct: 84.6
    status: "deprecated"
    note: >
      +84.6% 为早期 5000 步（未收敛）实验，且独立 PPO 训练量仅 1666 步/机
      （≈ MAPPO 的 1/3），不可比。已被同训练量收敛严格对比 +36.5% 取代，
      仅作历史探索记录，禁止作为权威/对外呈现。
  deprecated_n10:
    improvement_pct: 4.0
    status: "deprecated"
    note: "N=10 旧口径 +4.0% 为小样本估计（低估），N=20 权威 +36.5%（p=0.024）；N=10 值仅作历史记录。"

