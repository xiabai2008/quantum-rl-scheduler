# =============================================================================
test_methodology:
  normality_test:
    method: "Shapiro-Wilk (n<50) / D'Agostino K² (n≥50)"
    threshold: 0.05
  variance_homogeneity:
    method: "Levene检验"
  test_selection:
    both_normal_homoscedastic: "独立样本t检验"
    both_normal_heteroscedastic: "Welch t检验"
    either_non_normal: "Mann-Whitney U检验"
  effect_size:
    normal: "Cohen's d (<0.2 可忽略, 0.2-0.5 小, 0.5-0.8 中, ≥0.8 大)"
    nonparametric: "rank-biserial correlation (<0.1 可忽略, 0.1-0.3 小, 0.3-0.5 中, ≥0.5 大)"
  multiple_comparison_correction: "Bonferroni (校正 α = α / 比较次数)"
  confidence_interval: "均值差的95% CI"

# =============================================================================
# 实验14: 噪声鲁棒性交叉评估（预注册式，零重训，2026-08-09）
# 数据源: results/reports/noise_robustness_cross_eval_20260809.json
#   48 seeds × 6 格子（SS/SN/NS/NN/SM/NM）交叉评估，QA对账通过
#   （cell A=4105.7 vs 权威4115.5 偏差0.2%；cell D=4102.9 vs 4176.2 偏差1.8%）。
#   结论（D档诚实披露）：100K噪声训练未带来可检测鲁棒性增益，四个假设全不显著；
#   与 noise_feedback_v2（N=50，+1.5% p=0.584 不显著）方向自洽。
# =============================================================================
noise_robustness_cross_eval:
  experiment_name: "噪声鲁棒性交叉评估（负向结果：噪声训练无鲁棒性增益，非赋能证据）"
  applicable_condition: >
    48 对 (standard, noise) 模型 × 6 格子 = 288 次评估运行（零重训，复用
    models/noise_feedback_v2/ 已训练模型）。评估路径与 v2 权威版完全一致：
    PPOAgent.evaluate(deterministic=True)，env seed+10000 + DEFAULT_MACHINE_CONFIGS，
    max_steps=500，5 episodes/seed。MBS 注入格（SM/NM）手动 rollout。
    假设: H1 带噪环境 noise 模型更优；H1' 跨噪声类型鲁棒；H2 标准环境非劣效；
    H3 鲁棒缺口缩小。
  alpha: 0.05
  n: 48  # 配对模型数
  data_source: "results/reports/noise_robustness_cross_eval_20260809.json"

  strategy_summary:
    SS:
      mean_reward: 4105.7
      n: 48
    SN:
      mean_reward: 4115.3
      n: 48
    NS:
      mean_reward: 3857.9
      n: 48
    NN:
      mean_reward: 4102.9
      n: 48
    SM:
      mean_reward: 3678.5
      n: 48
    NM:
      mean_reward: 3405.0
      n: 48

  hypothesis_tests:
    H1_NN_vs_SN:
      test_method: "Wilcoxon signed-rank（配对，单侧 NN>SN）"
      p_value: 0.583
      d_z: -0.01
      mean_diff: -12.4
      significant: false
      conclusion: "不成立：噪声训练在带噪环境无显著收益"
    H1prime_NM_vs_SM:
      test_method: "Wilcoxon signed-rank（配对，单侧 NM>SM）"
      p_value: 0.967
      d_z: -0.29
      mean_diff: -273.5
      significant: false
      conclusion: "不成立：跨噪声类型亦无鲁棒性（NM 反低 7.4%）"
    H2_NS_vs_SS:
      test_method: "Wilcoxon signed-rank（配对，双向）"
      p_value: 0.059
      d_z: 0.20
      mean_diff: -247.8
      significant: false
      conclusion: "不成立：NS 比 SS 低 6.0%，噪声训练在标准环境有轻微 trade-off 倾向"
    H3_gap_std_vs_noise:
      test_method: "Wilcoxon signed-rank（配对，单侧 G_std>G_noise）"
      p_value: 0.5
      d_z: null
      significant: false
      conclusion: "不成立：G_std=9.6 vs G_noise=245.0，方向相反"
      note: "噪声模型的噪声鲁棒缺口反而更大，与 H3 预期相反"

  overall_conclusion: "D档诚实披露：100K 噪声训练未带来可检测鲁棒性增益；与 v2 权威（N=50，+1.5% p=0.584 不显著）自洽；不宣称'策略选择准则'成立，作为噪声感知训练工程闭环 + 方向性证据。"

